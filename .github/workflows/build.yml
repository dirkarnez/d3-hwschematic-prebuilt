# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
      
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
      with:
        repository: 'Nic30/d3-hwschematic'
        path: 'd3-hwschematic'
        ref: 'v0.1.6'
        
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - working-directory: 'd3-hwschematic'
      run: |
        npm install && \
        npm install --only=dev && \
        npm run build && \
        ls -R

    - working-directory: 'd3-hwschematic'
      run: |
        cp ./node_modules/d3/dist/d3.js ./dist/
        cp ./node_modules/elkjs/lib/elk.bundled.js ./dist/

    - name: Archive Release
      uses: thedoctor0/zip-release@master
      with:
        type: 'zip'
        directory: 'd3-hwschematic/dist'
        filename: "${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.node-version }}.zip"
        
    - name: Release prebuilt
      uses: ncipollo/release-action@v1
      with:
        artifacts: "d3-hwschematic/dist/${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.node-version }}.zip"
